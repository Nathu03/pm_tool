name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
    steps:
      - name: Post review placeholder
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**TaskFlow AI Review queued.** The AI review will be triggered automatically once the branch is merged and the task moves to AI_REVIEW status.\n\nFor immediate review, use the AI Assistant in the app.'
            });
