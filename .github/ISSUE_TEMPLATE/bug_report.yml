name: Bug Report
description: File a bug report
labels: [bug]
body:
  - type: input
    id: title
    attributes:
      label: Short description
      placeholder: e.g. Kanban card does not update status
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Related task number
      placeholder: PROJ-42
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: '1. Go to... 2. Click...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
